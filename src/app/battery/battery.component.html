<div
  class="mt-4 container-fluid p-0 align-items-center px-3"
  data-bs-theme="dark"
>
  <div class="row">
    @if (error()) { <div role="alert" class="text-warning">{{ error() }} <button class="btn btn-sm btn-outline-secondary" (click)="load()" [disabled]="busy()">Retry</button></div> }
    @if (status()) { <div role="status" class="text-info">{{ status() }}</div> }
    <div class="col">
      <h4 class="fs-4 fw-heavy">
        <img
          src="../../../assets/battery/battery.svg"
          class="align-text-middle px-2"
          alt="battery"
        />Battery Controls
      </h4>
    </div>
  </div>
  <div class="row">
    <div class="col-2">
      <label for="chargecontrol" class="col-form-label">Charge Control</label>
    </div>
    <div class="col-7">
      <input
        type="number"
        id="chargecontrol"
        class="form-control m-0 w-100 h-100"
        placeholder="Value"
        #chargeInput min="5" max="100" step="1"
        [disabled]="oldec() || loading() || busy()"
      />
    </div>
    <div class="col-3">
      <button
        type="button"
        class="btn btn-outline-secondary border-0 fs-4 w-100 h-100"
        [disabled]="oldec() || loading() || busy()"
        (click)="apply_limits(chargeInput.value)"
      >
        Apply
      </button>
    </div>
  </div>
  <div class="row pt-3">
    <div class="col-2">
      <label for="mode_battery" class="col-form-label">Set Battery Mode</label>
    </div>
    <div class="col-7">
      <select
        class="form-select text-white border-0 fs-4 bg-secondary rounded-1 w-100 h-100"
        id="mode_battery"
        #dropdown
        [disabled]="loading() || busy()"
      >
        <option value="normal" selected>Normal</option>
        <option value="idle">Idle</option>
        <option value="discharge">Discharge</option>
      </select>
    </div>
    <div class="col-3">
      <button
        type="button"
        class="btn btn-outline-secondary border-0 fs-4 w-100 h-100"
        (click)="apply_mode(dropdown.value)" [disabled]="loading() || busy()"
      >
        Apply
      </button>
    </div>
  </div>
  <div class="row pt-3">
    <div class="col-2">
      <label for="maxcurrent" class="col-form-label"
        >Battery Current Limit</label
      >
    </div>
    <div class="col-7">
      <input
        type="number"
        id="maxcurrent"
        class="form-control m-0 h-100 w-100"
        placeholder="Value in mA"
        #currentInput min="0" max="65535" step="1" [disabled]="loading() || busy()"
      />
    </div>
    <div class="col-3">
      <button
        type="button"
        class="btn btn-outline-secondary border-0 fs-4 w-100 h-100"
        (click)="apply_maximum_current(currentInput.value)" [disabled]="loading() || busy()"
      >
        Apply
      </button>
    </div>
  </div>
</div>
