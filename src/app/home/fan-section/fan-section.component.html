<div class="container-fluid align-items-center px-auto m-0">
  <div class="text-left mt-3 container-fluid w-100 text-start p-0">
    <div class="row w-100 align-items-center">
      <div class="col-5 p-0 m-0">
        <h4 class="fs-4 fw-heavy" [class.disable]="!fanAvailable()">
          <img
            src="../../../assets/fan/fan.svg"
            class="align-text-middle mx-2"
            alt="fan"
          />Mode - <span id="selected_mode">{{ selectedMode() }}</span>
        </h4>
      </div>
      <div class="col-3 align-middle">
        <h4 class="fs-4 fw-heavy">CPU: <span id="temp">{{ temperature() ?? 'N/A' }}</span> °C</h4>
      </div>
      <div class="col-4">
        <h4 class="fs-4 fw-heavy" [class.disable]="!fanAvailable()">
          Fan: <span id="fanRPM">{{ rpm() ?? 'N/A' }}</span> RPM
        </h4>
      </div>
    </div>
  </div>
</div>

@if (error()) {
  <div role="alert" class="text-danger px-3">{{ error() }}</div>
}
<div class="container-fluid px-3" [class.disable]="!fanAvailable()">
  <div class="row">
    <div class="col p-0 m-1">
      <button
        type="button"
        class="btn fs-4 w-100 h-100"
        [class]="'btn-outline-success border-0 ' + (state().mode === 'auto' ? 'active' : '')"
        [attr.aria-pressed]="state().mode === 'auto'"
        [disabled]="!fanAvailable()"
        (click)="fan_auto()"
        title="EC-managed automatic fan control"
      >
        <img
          class="p-2 pb-2"
          src="../../../assets/fan/leaf.svg"
          alt="leaf"
        /><br />Auto
      </button>
    </div>
    <div class="col p-0 m-1">
      <button
        type="button"
        class="btn fs-4 w-100 h-100"
        [class]="'btn-outline-warning border-0 ' + (state().mode === 'off' ? 'active' : '')"
        [attr.aria-pressed]="state().mode === 'off'"
        [disabled]="!fanAvailable()"
        (click)="fan_off()"
      >
        <img
          class="p-2 pb-2"
          src="../../../assets/fan/bicycle.svg"
          alt="bicycle"
        /><br />Off
      </button>
    </div>
    <div class="col p-0 m-1">
      <button
        type="button"
        class="btn fs-4 w-100 h-100"
        [class]="'btn-outline-danger border-0 ' + (state().mode === 'max' ? 'active' : '')"
        [attr.aria-pressed]="state().mode === 'max'"
        [disabled]="!fanAvailable()"
        (click)="fan_max()"
      >
        <img
          class="p-2 pb-2"
          src="../../../assets/fan/rocket.svg"
          alt="rocket"
        /><br />Max
      </button>
    </div>
    <div class="col p-0 m-1">
      <button
        type="button"
        class="btn fs-4 w-100 h-100"
        [class]="'btn-outline-info btn-outline-info-custom border-0 ' + (state().mode === 'custom' ? 'active' : '')"
        [attr.aria-pressed]="state().mode === 'custom'"
        [disabled]="!fanAvailable()"
        (click)="open_fan_custom_window()"
      >
        <img
          class="pb-2"
          src="../../../assets/fan/wrench.svg"
          alt="bicycle"
        /><br />Custom
      </button>
    </div>
  </div>
</div>
