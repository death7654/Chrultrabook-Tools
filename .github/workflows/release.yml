name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ubuntu-deps: "dpkg-dev fakeroot libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-0 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev desktop-file-utils libudev-dev rpm libgtk-3-dev"

jobs:
  release:
    name: Build and Release
    strategy:
      fail-fast: false
      matrix:
        platform: 
          - ubuntu-22.04
          - windows-2022
          - macos-15-intel
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Github Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install OS dependencies and setup build environment
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.ubuntu-deps }}
      - name: Install npm dependencies
        run: npm install
      - name: Setup Windows Build Enviornment
        if: matrix.platform == 'windows-2022'
        run: |
          mkdir $env:GITHUB_WORKSPACE\src-tauri\build
          copy $env:GITHUB_WORKSPACE\LICENSE $env:GITHUB_WORKSPACE\src-tauri\build
          copy $env:GITHUB_WORKSPACE\README.md $env:GITHUB_WORKSPACE\src-tauri\build
        shell: powershell
      - name: Setup macOS and Linux Build Environment
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'macos-15-intel'
        run: |
            mkdir -p $GITHUB_WORKSPACE/src-tauri/build
            cp LICENSE $GITHUB_WORKSPACE/src-tauri/build
            cp README.md $GITHUB_WORKSPACE/src-tauri/build
            
      - name: Build Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Arch Linux Package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work archlinux:base-devel bash -c "
          pacman -Syu --noconfirm  &&
          useradd -m builduser &&
          echo 'builduser ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
          chown -R builduser:builduser /work &&
          su - builduser -c '
            set -e
            cd /work/src-tauri &&

            curl https://sh.rustup.rs -sSf | bash -s -- -y &&
            source \$HOME/.cargo/env &&

            mkdir -p target/release/bundle/arch/ &&
            cp target/release/bundle/deb/*.deb target/release/bundle/arch/ &&
            cp tauri.conf.json target/release/bundle/arch/ &&
            cp -r linux/arch/* target/release/bundle/arch/ &&

            cd target/release/bundle/arch &&
            makepkg -df --noconfirm
          ' "


      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Chrultrabook-Tools-${{ matrix.platform }}
          retention-days: 30
          path: |
            # Windows
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

            # Linux
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/linux/arch/*.pkg.tar.zst

            # macOS
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Artifacts to GitHub Draft Release
        uses: softprops/action-gh-release@v3
        with:
          name: "draft_release"
          tag_name: v__VERSION__
          draft: true
          update_draft: true
          files: |
            # Windows
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

            # Linux
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/arch/*.pkg.tar.zst

            # macOS
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

